<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==">
    <title>Area de Login</title>
</head>
<body>

    <main>
        <form action="">
            <div class="area-titulo">
               <i class="fa-solid fa-user-secret"></i>
            <h1>Portifolio da Evilyn</h1>
        </div>
            
        <div class="area-email">
            <label for email="email">Email</label>
            <input type="email" id="email">
        </div>

        <div class="area-senha">
            <label for email="senha">Email</label>
            <input type="password" id="senha">

        <div class="lembrar senha">
            <input type="checkbox" id="lembrar">
            <label for="lembrar">Lembrar-me</label>
            <a href="#">Esqueceu a senha?</a>
        </div>    

        <div>

        <div class="area-botao">
            <button>Acessar</button>
        </div>

    </form>
    
</body>
</html>
